<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>OW内战-大乱炖</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>">
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4e4f51, #686868);
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(98, 139, 214, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif
        }

        body {
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 10px 6px 80px;
            position: relative;
            font-size: 13px;
            background: radial-gradient(circle at top left, #161b22 0%, #0d1117 70%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto
        }

        #backHomeBtn {
            position: fixed;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, #21262d, #1f6feb);
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 8px 18px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(30, 100, 220, .3);
            transition: all .3s;
        }

        #backHomeBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 100, 220, .5)
        }

        h2 {
            color: #58a6ff;
            text-align: center;
            font-size: 24px;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        select, input {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 9px 14px;
            color: #c9d1d9;
            outline: none;
            font-size: 13px;
            transition: all .2s;
        }

        select:focus, input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, .2);
        }

        .btn-small, .btn-big {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            cursor: pointer;
            transition: all .3s;
            font-weight: bold;
        }

        .btn-small {
            padding: 7px 15px;
            font-size: 12px
        }

        .btn-big {
            padding: 11px 32px;
            font-size: 14px
        }

        .btn-small:hover, .btn-big:hover {
            background: #30363d;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        #autoTeamBtn {
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            border: none;
            color: white;
        }

        #clearBtn {
            background: #3b1e24;
            border: 1px solid #da3633;
            color: #ff7b72;
        }

        .selected-info {
            text-align: center;
            margin: 15px 0;
            color: #58a6ff;
            font-weight: bold;
            font-size: 15px;
        }

        .player-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin: 15px auto;
            max-width: 1000px;
        }

        .search-add {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap
        }

        .player-grid {
            display: grid;
            grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #30363d;
        }

        .player-item {
            background: #21262d;
            border: 1px solid #30363d;
            font-size: 12px;
            border-radius: 8px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all .25s;
            font-weight: bold;
        }

        .player-item:hover {
            background: #30363d;
            border-color: #58a6ff;
        }

        .player-item.selected {
            background: #1f6feb;
            color: white;
            border-color: #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, .4);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 90%;
            max-width: 1100px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(0, 0, 0, .7);
        }

        .modal-header {
            text-align: center;
            padding: 20px;
            color: #58a6ff;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;
        }

        .teams-result {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            padding: 24px;
        }

        .result-team {
            background: #21262d;
            border-radius: 12px;
            padding: 18px;
            border: 2px solid #30363d;
            transition: all .4s;
        }

        .result-team h3 {
            text-align: center;
            margin-bottom: 14px;
            font-size: 16px;
        }

        .team-list {
            font-size: 14px;
            line-height: 2.3;
            text-align: center
        }

        .team-0 {
            border-color: #ff5555 !important
        }

        .team-0 h3 {
            color: #ff5555
        }

        .team-1 {
            border-color: #58a6ff !important
        }

        .team-1 h3 {
            color: #58a6ff
        }

        .team-2 {
            border-color: #50fa7b !important
        }

        .team-2 h3 {
            color: #50fa7b
        }

        .team-3 {
            border-color: #f1fa8c !important
        }

        .team-3 h3 {
            color: #f1fa8c
        }

        .team-4 {
            border-color: #ff79c6 !important
        }

        .team-4 h3 {
            color: #ff79c6
        }

        .team-5 {
            border-color: #bd93f9 !important
        }

        .team-5 h3 {
            color: #bd93f9
        }

        .spectators {
            margin: 20px 24px;
            padding: 18px;
            background: #161b22;
            border: 1px dashed #30363d;
            border-radius: 12px;
            text-align: center;
        }

        .spectators h3 {
            color: #8b949e;
            margin-bottom: 14px;
            font-size: 15px;
        }

        .spec-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .spec-item {
            padding: 6px 14px;
            background: #30363d;
            border-radius: 8px;
            font-size: 13px;
            min-width: 80px;
        }

        .modal-buttons {
            text-align: center;
            padding: 20px;
        }

        .modal-buttons button + button {
            margin-left: 16px
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 17, 23, .95);
            color: #8b949e;
            text-align: center;
            padding: 12px 0;
            font-size: 13px;
            border-top: 1px solid #30363d;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 20, .97);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #58a6ff;
            font-size: 18px;
            backdrop-filter: blur(5px);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #21262d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0)
            }
            100% {
                transform: rotate(360deg)
            }
        }
    </style>
</head>
<body>

<button id="backHomeBtn" onclick="window.location.href='index.html'">返回首页</button>

<div class="container">
    <h2>OW内战-大乱炖</h2>
    <div class="subtitle">均衡 + 随机</div>

    <div class="controls">
        <select id="modeSelect">
            <option value="6">6v6 模式</option>
            <option value="5">5v5 模式</option>
        </select>
        <button id="autoTeamBtn" class="btn-big">开始分队</button>
        <button id="clearBtn" class="btn-big">清空已选</button>
    </div>

    <div class="selected-info">已选中 <span id="count">0</span> 人</div>

    <div class="player-card">
        <div class="search-add">
            <input type="text" id="searchInput" placeholder="搜索或输入新玩家名字..." oninput="filterPlayers()">
            <select id="newLevel">
                <option value="1">⭐</option>
                <option value="2" selected>⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="4">⭐⭐⭐⭐</option>
            </select>
            <button class="btn-small" onclick="addCustomPlayer()">添加</button>
        </div>
        <div class="player-grid" id="playerGrid"></div>
    </div>
</div>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div>正在计算最优均衡分队...</div>
</div>

<div id="resultModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">分队结果</div>
        <div class="teams-result" id="teamsResult"></div>
        <div class="spectators">
            <h3>观战人员（<span id="specCount">0</span>人）</h3>
            <div class="spec-list" id="specList"></div>
        </div>
        <div class="modal-buttons">
            <button class="btn-big" onclick="document.getElementById('resultModal').style.display='none'">关闭</button>
            <button class="btn-big" style="background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;"
                    onclick="restartBalance()">重新分队
            </button>
        </div>
    </div>
</div>

<div class="footer">烧瘸🍆 © 2025</div>

<script src="js/config.js"></script>
<script>
    const PRESET_PLAYERS = window.PRESET_PLAYERS

    let allPlayers = PRESET_PLAYERS.map(p => ({...p}));
    let selected = new Set();

    document.addEventListener('DOMContentLoaded', () => {
        renderAll();
        document.getElementById('autoTeamBtn').onclick = startBalance;
        document.getElementById('clearBtn').onclick = () => {
            selected.clear();
            renderAll();
        };
    });

    function renderAll() {
        filterPlayers();
        document.getElementById('count').textContent = selected.size;
    }

    function filterPlayers() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allPlayers.filter(p => p.name.toLowerCase().includes(keyword));
        document.getElementById('playerGrid').innerHTML = filtered.map(p => `
            <div class="player-item ${selected.has(p.name) ? 'selected' : ''}" onclick="toggle('${p.name}')">
                ${p.name}
            </div>
        `).join('');
    }

    function toggle(name) {
        selected.has(name) ? selected.delete(name) : selected.add(name);
        renderAll();
    }

    function addCustomPlayer() {
        const name = document.getElementById('searchInput').value.trim();
        if (!name) return alert('请输入名字');
        if (allPlayers.some(p => p.name === name)) return alert('该玩家已存在');
        const level = parseInt(document.getElementById('newLevel').value);
        allPlayers.push({name, level});
        document.getElementById('searchInput').value = '';
        renderAll();
    }

    function showLoading() {
        document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    function startBalance() {
        if (selected.size < 10) return alert('至少10人才能开局');
        showLoading();
        setTimeout(realBalance, 1100);
    }

    // 真正的均衡分配算法（总星级几乎完全相等）
    function realBalance() {
        const mode = parseInt(document.getElementById('modeSelect').value);
        const teamSize = mode;
        const teamCount = Math.floor(selected.size / teamSize);

        let players = Array.from(selected).map(name => {
            const p = allPlayers.find(x => x.name === name);
            return {name: p.name, level: p.level};
        });

        // 每次都彻底打乱顺序，保证结果不同
        players.sort(() => Math.random() - 0.5);

        // 按星级从高到低排序（关键）
        players.sort((a, b) => b.level - a.level);

        // 初始化队伍
        const teams = Array.from({length: teamCount}, () => ({
            players: [],
            totalLevel: 0
        }));

        // 贪心分配：每次把当前最强的玩家分到当前总星级最低的队伍
        players.forEach(player => {
            // 找到当前总星级最低的队伍
            let targetTeam = teams[0];
            for (let i = 1; i < teams.length; i++) {
                if (teams[i].totalLevel < targetTeam.totalLevel) {
                    targetTeam = teams[i];
                }
            }
            if (targetTeam.players.length < teamSize) {
                targetTeam.players.push(player);
                targetTeam.totalLevel += player.level;
            }
        });

        // 剩余玩家作为观战
        const spectators = players.slice(teamCount * teamSize).map(p => p.name);

        hideLoading();
        showResult(teams.map(t => t.players), spectators);
    }

    function restartBalance() {
        document.getElementById('resultModal').style.display = 'none';
        startBalance();
    }

    function showResult(teams, spectators) {
        const names = ['红队', '蓝队', '绿队', '黄队', '粉队', '紫队'];
        let html = '';
        teams.forEach((team, i) => {
            const total = team.reduce((s, p) => s + p.level, 0);
            html += `<div class="result-team team-${i}">
                <h3>${names[i] || '队伍' + (i + 1)}（${team.length}人）</h3>
                <div class="team-list">${team.map(p => `${p.name}`).join('<br>')}</div>
            </div>`;
        });
        document.getElementById('teamsResult').innerHTML = html;

        const specHtml = spectators.length
            ? spectators.map(n => `<div class="spec-item">${n}</div>`).join('')
            : '<div style="color:#8b949e;padding:10px">无观战人员</div>';
        document.getElementById('specList').innerHTML = specHtml;

        document.getElementById('resultModal').style.display = 'flex';
    }
</script>
</body>
</html>
