<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：防跳动 + 禁止缩放 + 完美适配手机 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OW内战工具 - 赛博模式选择</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 终极核心：允许滚动 + 彻底隐藏滚动条 + 防地址栏跳动 */
        html, body {
            height: 100dvh; /* 动态视口高度，神级防跳 */
            margin: 0;
            overflow-y: auto; /* 允许垂直滚动 */
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; /* iOS 丝滑 */
            scrollbar-width: none; /* Firefox 隐藏滚动条 */
            -ms-overflow-style: none; /* IE/Edge 隐藏滚动条 */
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* Chrome/Safari 隐藏滚动条 */

        body {
            background: #0d0b1a;
            color: #e0faff;
            font-family: 'Orbitron', 'Microsoft YaHei', sans-serif;
            position: relative;
            padding: 20px 0;
        }

        /* 赛博网格背景（固定不随内容滚动） */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0.05) 1px, transparent 1px),
            linear-gradient(rgba(138, 43, 226, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            animation: gridMove 30s linear infinite;
            z-index: -2;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0)
            }
            100% {
                transform: translate(40px, 40px)
            }
        }

        /* 扫描线特效 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px);
            pointer-events: none;
            animation: scan 10s linear infinite;
            z-index: -1;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%)
            }
            100% {
                transform: translateY(100%)
            }
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
            padding: 40px 25px;
            background: rgba(10, 8, 30, 0.85);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6),
            inset 0 0 60px rgba(0, 255, 255, 0.1);
            border: 1px solid #8a2be2;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(12px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8a2be2, #00ffff, #ff00ff, #8a2be2);
            background-size: 300% 100%;
            animation: neonFlow 4s infinite linear;
        }

        @keyframes neonFlow {
            0%, 100% {
                background-position: 0%
            }
            50% {
                background-position: 100%
            }
        }

        .header {
            margin-bottom: 50px;
            position: relative;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #8a2be2, 0 0 40px #00ffff;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 0 0 20px #8a2be2, 0 0 40px #00ffff;
            }
            14% {
                text-shadow: -5px 0 #ff00ff, 5px 0 #00ffff;
            }
            15% {
                text-shadow: 5px 0 #ff00ff, -5px 0 #00ffff;
            }
            16% {
                text-shadow: 0 0 20px #8a2be2, 0 0 40px #00ffff;
            }
        }

        h1 {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(90deg, #8a2be2, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            opacity: 0.9;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin: 50px 0;
        }

        .mode-card {
            background: linear-gradient(135deg, rgba(20, 10, 60, 0.8), rgba(10, 5, 40, 0.9));
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .mode-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(138, 43, 226, 0.15) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .mode-card:hover::before {
            transform: translateX(100%);
        }

        .mode-card:hover {
            transform: translateY(-15px) scale(1.03);
            border: 1px solid #8a2be2;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.8), 0 0 80px rgba(0, 255, 255, 0.4);
        }

        .mode-icon {
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px currentColor;
        }

        .mode-title {
            font-size: 26px;
            font-weight: 900;
            margin: 15px 0;
            color: #8a2be2;
            text-shadow: 0 0 15px #8a2be2;
        }

        .mode-description {
            font-size: 15px;
            line-height: 1.7;
            color: #00ffff;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .mode-features {
            text-align: center;
            width: 100%;
            margin: 20px 0;
            padding: 0 20px;
        }

        .mode-features li {
            margin: 12px 0;
            font-size: 14px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            position: relative;
            padding-left: 10px;
        }

        .mode-features li::before {
            content: ">";
            color: #00ffff;
            position: absolute;
            left: -15px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1
            }
            50% {
                opacity: 0.3
            }
        }

        .mode-btn {
            margin-top: 20px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 12px 32px;
            font-family: 'Orbitron';
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            text-shadow: 0 0 10px #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .mode-btn:hover {
            color: #0d0b1a;
            background: #00ffff;
            text-shadow: none;
            box-shadow: 0 0 30px #00ffff;
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .footer {
            margin-top: 60px;
            color: #8a2be2;
            font-size: 14px;
            margin-left: 50%;
            transform: translateX(-50%);
            text-shadow: 0 0 10px #8a2be2;
            letter-spacing: 1px;
        }

        .footer a {
            color: #00ffff;
            text-decoration: none;
            position: relative;
        }

        .footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #00ffff;
            transition: width 0.3s;
            box-shadow: 0 0 10px #00ffff;
        }

        .footer a:hover::after {
            width: 100%;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .mode-selection {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            .mode-selection {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 36px;
            }

            .logo {
                font-size: 60px;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">这特么是小分队</div>
        <h1>OW INNER WAR</h1>
        <p class="subtitle">选择命运 · 进入战场</p>
    </div>

    <div class="mode-selection">
        <div class="mode-card" onclick="selectMode('randomTeamHero')">
            <div class="mode-icon">全随机模式</div>
            <div class="mode-description">玩家随机分组 · 英雄随机分配</div>
            <ul class="mode-features">
                <li>人员随机分组</li>
                <li>英雄随机分配</li>
                <li>实力自动平衡</li>
                <li>内幕敌对·内幕英雄</li>
            </ul>
            <button class="mode-btn">ENTER</button>
        </div>

        <div class="mode-card" onclick="selectMode('fixedTeamHero')">
            <div class="mode-icon">自选模式</div>
            <div class="mode-description">队伍自选 · 仅随机英雄</div>
            <ul class="mode-features">
                <li>支持自定义玩家</li>
                <li>英雄随机分配</li>
                <li>保留原有队伍</li>
                <li>无内幕纯绿色</li>
            </ul>
            <button class="mode-btn">ENTER</button>
        </div>

        <div class="mode-card" onclick="selectMode('chaos')">
            <div class="mode-icon">大乱炖模式</div>
            <div class="mode-description">多人运动 · 自动多组分配</div>
            <ul class="mode-features">
                <li>多人运动神器</li>
                <li>均衡队伍实力</li>
                <li>闲人落位观众</li>
                <li>适合大乱炖</li>
            </ul>
            <button class="mode-btn">ENTER</button>
        </div>
    </div>
</div>

<div class="footer">
    瘸子Neon出品 · 2025 小分队终极版 |
    <a href="javascript:void(0)"
       onclick="alert('OW内战工具 v3.0\n赛博朋克·神经植入版\n作者：瘸子Neon\n\n已接入矩阵，欢迎来到真实世界')">SYSTEM
        INFO</a>
</div>

<script>
    function selectMode(mode) {
        const card = event.currentTarget;
        const btn = card.querySelector('.mode-btn');
        btn.innerHTML = '<span style="color:#ff00ff">LOADING...</span>';

        setTimeout(() => {
            switch (mode) {
                case 'randomTeamHero':
                    location.href = 'randomHero.html';
                    break;
                case 'fixedTeamHero':
                    location.href = 'fixedTeamHero.html';
                    break;
                case 'chaos':
                    location.href = 'chaos.html';
                    break;
            }
        }, 1000);
    }
</script>
</body>
</html>
