<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>随机英雄抽取器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>🎮 英雄随机抽取器 </h2>
<div class="feature-switches">
    <span style="cursor:pointer; margin-right: 20px;">
        <input type="checkbox" style="width: 20px" id="allowRepeat" checked>
        允许两队重复英雄
    </span>
    <!-- 添加随机英雄开关 -->
    <span style="cursor:pointer; margin-right: 20px;">
        <input type="checkbox" style="width: 20px" id="randomHero" checked>
        自动分配英雄
    </span>
</div>

<div class="hero-pool-management">
    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
        <input id="heroInput" class="player-input" placeholder="添加英雄，如: T-莱因哈特">
        <button id="addHeroBtn" class="small-btn">添加英雄</button>
        <button id="resetHeroPoolBtn" class="small-btn">重置英雄池</button>
    </div>
    <div class="hero-pool-display" id="heroPoolDisplay">
        <!-- 英雄池将通过JS动态生成 -->
    </div>
</div>

<div class="player-management">
    <div class="mode-selector">
        <button id="customModeBtn" class="mode-btn active">自定义玩家</button>
        <button id="selectModeBtn" class="mode-btn">玩家列表</button>
    </div>

    <!-- 自定义玩家模式 -->
    <div id="customMode" class="player-mode">
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
            <input id="playerNameInput" class="player-input" placeholder="玩家名称">
            <select id="playerLevelInput">
                <option value="3">A</option>
                <option value="2">B</option>
                <option value="1">C</option>
            </select>
            <select id="playerRoleInput">
                <option value="any">任意位置</option>
                <option value="T">🛡️坦克</option>
                <option value="C">⚔️输出</option>
                <option value="N">🩹支援</option>
            </select>
            <button id="addPlayerBtn" class="small-btn">添加玩家</button>
        </div>
    </div>

    <!-- 快速添加模式 -->
    <div id="selectMode" class="player-mode hidden">
        <div class="player-selector" id="playerSelector">
            <!-- 玩家选项将通过JS动态生成 -->
        </div>
    </div>

    <div class="player-list" id="playerList">
        <!-- 玩家列表将通过JS动态生成 -->
    </div>

    <!-- 清空按钮放在玩家列表下面 -->
    <div style="display: flex; justify-content: center; margin-top: 10px;">
        <button id="clearPlayersBtn" class="small-btn" style="background: #e75757">清空玩家列表</button>
    </div>
</div>

<button id="startBtn" style="margin-bottom: 20px">🎲 开始分配</button>

<!-- 弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div id="rollText" class="hero-roll">分配中...</div>
        <div id="finalResult" style="display:none;">
        </div>
        <div class="modal-footer">瘸子🍆出品 · 包装私密 顺丰包邮🙂</div>
    </div>
</div>
<div class="footer">
    瘸子🍆出品 · 包装私密 顺丰包邮🙂
</div>

<script src="js/script.js"></script>
</body>
</html>
