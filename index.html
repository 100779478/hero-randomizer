<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>随机英雄抽取器</title>
    <style>
        body {
            font-family: "Microsoft YaHei";
            background: #111;
            color: #fff;
            text-align: center;
            padding: 10px;
        }

        h2 {
            color: #ffcc00;
            text-shadow: 0 0 10px #ffaa00;
        }

        .hero-pool-management {
            width: 90%;
            margin: 0 auto 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .hero-pool-display {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .hero-item {
            background: #2a2a2a;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            transition: 0.3s;
            position: relative;
        }

        .hero-item:hover {
            background: #333;
        }

        .hero-item.tank {
            border-left: 3px solid #00aaff;
        }

        .hero-item.support {
            border-left: 3px solid #4CAF50;
        }

        .hero-item.damage {
            border-left: 3px solid #ff3366;
        }

        .hero-remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff6666;
            border: none;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: none;
        }

        .hero-item:hover .hero-remove-btn {
            position: absolute;
            top: -25px;
            right: -5px;
            background: #ff6666;
            border: none;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-management {
            width: 90%;
            margin: 0 auto 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .player-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }

        .player-item {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .player-item:hover {
            background: #333;
        }

        .player-item span.name {
            font-weight: bold;
            flex-grow: 1;
            text-align: left;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #ff6666;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn:hover {
            color: #ff2222;
        }

        textarea {
            width: 90%;
            height: 70px;
            border-radius: 8px;
            padding: 10px;
            border: none;
            resize: none;
            font-size: 14px;
            background: #222;
            color: #fff;
            margin-bottom: 20px;
        }

        input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #555;
            background: #1a1a1a;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 10px #ffcc00;
        }

        .player-input {
            width: 200px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #555;
            background: #1a1a1a;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            cursor: pointer;
        }

        select:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 10px #ffcc00;
        }

        option {
            background: #1a1a1a;
            color: #fff;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            background: #ffcc00;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 15px;
        }

        button:hover {
            background: #ffaa00;
        }

        .small-btn {
            margin-top: 0;
            padding: 6px 12px;
            font-size: 13px;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #222;
            padding: 25px;
            border-radius: 10px;
            width: 700px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .modal-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            border-top: 1px solid #444;
            padding-top: 10px;
            text-align: center;
            letter-spacing: 1px;
            opacity: 0.8;
            transition: 0.3s;
        }

        .modal-footer:hover {
            color: #ffcc00;
            opacity: 1;
        }

        .hero-roll {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 15px;
            animation: roll 0.5s infinite linear;
        }

        @keyframes roll {
            0% {
                transform: scale(1);
                color: #ffcc00;
            }
            50% {
                transform: scale(1.3);
                color: #ff6699;
            }
            100% {
                transform: scale(1);
                color: #00ccff;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #555;
        }

        th {
            background: #333;
        }

        .teamA-row {
            background: rgba(0, 170, 255, 0.12);
        }

        .teamB-row {
            background: rgba(255, 51, 102, 0.12);
        }

        .info {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .footer {
            position: fixed;
            bottom: 5px;
            color: #888;
            border-top: 1px solid #444;
            background: #131313;
            padding-top: 5px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .footer:hover {
            color: purple;
            font-size: 18px;
            font-weight: bold;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(21, 21, 21, 0.63);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #5c5c5c;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #818081;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #555;
            background: #1a1a1a;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: #ffcc00;
            color: #000;
            border-color: #ffcc00;
        }

        .player-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .player-option {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .player-option:hover {
            background: #333;
        }

        .player-option.selected {
            background: #ffcc00;
            color: #000;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<h2>🎮 英雄随机抽取器 </h2>
<div>
    <span style="cursor:pointer">
        <input type="checkbox" style="width: 20px" id="allowRepeat" checked>
        允许两队重复英雄
    </span>
</div>

<div class="hero-pool-management">
    <h3 style="color:#ffcc00;">英雄池管理</h3>
    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
        <input id="heroInput" class="player-input" placeholder="添加英雄，如: T-莱因哈特">
        <button id="addHeroBtn" class="small-btn">添加英雄</button>
        <button id="resetHeroPoolBtn" class="small-btn">重置英雄池</button>
    </div>
    <div class="hero-pool-display" id="heroPoolDisplay">
        <!-- 英雄池将通过JS动态生成 -->
    </div>
</div>

<div class="player-management">
    <h3 style="color:#ffcc00;">玩家管理</h3>

    <div class="mode-selector">
        <button id="customModeBtn" class="mode-btn active">自定义玩家</button>
        <button id="selectModeBtn" class="mode-btn">玩家列表</button>
    </div>

    <!-- 自定义玩家模式 -->
    <div id="customMode" class="player-mode">
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
            <input id="playerNameInput" class="player-input" placeholder="玩家名称">
            <select id="playerLevelInput">
                <option value="1">A</option>
                <option value="2">B</option>
                <option value="3">C</option>
            </select>
            <button id="addPlayerBtn" class="small-btn">添加玩家</button>
            <button id="clearPlayersBtn" class="small-btn">清空玩家列表</button>
        </div>
    </div>

    <!-- 选择玩家模式 -->
    <div id="selectMode" class="player-mode hidden">
        <div style="margin-bottom: 10px;">
            <button id="selectAllBtn" class="small-btn">全选</button>
            <button id="deselectAllBtn" class="small-btn">取消全选</button>
            <button id="addSelectedBtn" class="small-btn">添加选中玩家</button>
            <button id="clearPlayersBtn2" class="small-btn">清空玩家列表</button>
        </div>
        <div class="player-selector" id="playerSelector">
            <!-- 玩家选项将通过JS动态生成 -->
        </div>
    </div>

    <div class="player-list" id="playerList">
        <!-- 玩家列表将通过JS动态生成 -->
    </div>
</div>

<button id="startBtn" style="margin-bottom: 20px">🎲 开始抽取英雄</button>

<!-- 弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div id="rollText" class="hero-roll">抽取中...</div>
        <div id="finalResult" style="display:none;">
        </div>
        <div class="modal-footer">瘸子🍆出品 · 包装私密 顺丰包邮🙂</div>
    </div>
</div>
<div class="footer">
    瘸子🍆出品 · 包装私密 顺丰包邮🙂
</div>
<script>
    // 全局变量
    const allPlayers = [];
    const teamA = [];
    const teamB = [];
    const modal = document.getElementById('modal');
    const rollText = document.getElementById('rollText');
    const finalResult = document.getElementById('finalResult');

    // 默认英雄池
    let heroPool = [
        'N-无漾', 'N-安娜', 'N-巴蒂斯特', 'N-布丽吉塔', 'N-禅雅塔', 'N-卢西奥', 'N-生命之梭', 'N-天使', 'N-雾子', 'N-伊拉锐', 'N-朱诺',
        'C-弗蕾娅', 'C-艾什', 'C-半藏', 'C-堡垒', 'C-法老之鹰', 'C-黑百合', 'C-黑影', 'C-回声', 'C-卡西迪', 'C-狂鼠', 'C-猎空', 'C-美', 'C-莫伊拉', 'C-士兵76', 'C-死神',
        'C-索杰恩', 'C-探奇', 'C-托比昂', 'C-源氏', 'C-秩序之光',
        'T-奥丽莎', 'T-查莉娅', 'T-D.VA', 'T-骇灾', 'T-拉玛刹', 'T-莱因哈特', 'T-路霸', 'T-毛加', 'T-末日铁拳', 'T-破坏球', 'T-温斯顿', 'T-西格玛', 'T-渣客女王'
    ];

    // 预设玩家数据 (20人)
    const presetPlayers = [
        {name: '白', level: 2},
        {name: '波哥', level: 3},
        {name: '七海', level: 2},
        {name: '慢树', level: 1},
        {name: '豪门将进酒', level: 2},
        {name: 'Ricky', level: 3},
        {name: '狗哥', level: 2},
        {name: '小匕首', level: 1},
        {name: '小岳', level: 2},
        {name: '源哥', level: 3},
        {name: '小宇', level: 1},
    ];

    // 渲染英雄池
    function renderHeroPool() {
        const heroPoolDisplay = document.getElementById('heroPoolDisplay');
        heroPoolDisplay.innerHTML = heroPool.map((hero, index) => {
            const heroInfo = parseHero(hero);
            let roleClass = '';
            if (heroInfo) {
                if (heroInfo.role === 'T') roleClass = 'tank';
                else if (heroInfo.role === 'N') roleClass = 'support';
                else if (heroInfo.role === 'C') roleClass = 'damage';
            }
            return `
                <div class="hero-item ${roleClass}">
                    ${hero}
                    <button class="hero-remove-btn" onclick="removeHero(${index})">×</button>
                </div>
            `;
        }).join('');
    }

    // 添加英雄
    document.getElementById('addHeroBtn').addEventListener('click', () => {
        const heroInput = document.getElementById('heroInput');
        const hero = heroInput.value.trim();

        if (!hero) {
            alert('请输入英雄名称！');
            return;
        }

        // 检查格式
        const heroInfo = parseHero(hero);
        if (!heroInfo) {
            alert('英雄格式不正确！请使用格式：T-坦克名, N-支援名, C-输出名');
            return;
        }

        // 检查是否已存在
        if (heroPool.includes(hero)) {
            alert('该英雄已存在！');
            return;
        }

        heroPool.push(hero);
        renderHeroPool();
        heroInput.value = '';
    });

    // 删除英雄
    function removeHero(index) {
        heroPool.splice(index, 1);
        renderHeroPool();
    }

    // 重置英雄池
    document.getElementById('resetHeroPoolBtn').addEventListener('click', () => {
        if (confirm('确定要重置英雄池吗？这将恢复默认英雄列表。')) {
            heroPool = [
                'N-无漾', 'N-安娜', 'N-巴蒂斯特', 'N-布丽吉塔', 'N-禅雅塔', 'N-卢西奥', 'N-生命之梭', 'N-天使', 'N-雾子', 'N-伊拉锐', 'N-朱诺',
                'C-弗蕾娅', 'C-艾什', 'C-半藏', 'C-堡垒', 'C-法老之鹰', 'C-黑百合', 'C-黑影', 'C-回声', 'C-卡西迪', 'C-狂鼠', 'C-猎空', 'C-美', 'C-莫伊拉', 'C-士兵76',
                'C-死神', 'C-索杰恩', 'C-探奇', 'C-托比昂', 'C-源氏', 'C-秩序之光',
                'T-奥丽莎', 'T-查莉娅', 'T-D.VA', 'T-骇灾', 'T-拉玛刹', 'T-莱因哈特', 'T-路霸', 'T-毛加', 'T-末日铁拳', 'T-破坏球', 'T-温斯顿', 'T-西格玛', 'T-渣客女王'
            ];
            renderHeroPool();
        }
    });

    // 模式切换
    document.getElementById('customModeBtn').addEventListener('click', () => {
        document.getElementById('customModeBtn').classList.add('active');
        document.getElementById('selectModeBtn').classList.remove('active');
        document.getElementById('customMode').classList.remove('hidden');
        document.getElementById('selectMode').classList.add('hidden');
    });

    document.getElementById('selectModeBtn').addEventListener('click', () => {
        document.getElementById('selectModeBtn').classList.add('active');
        document.getElementById('customModeBtn').classList.remove('active');
        document.getElementById('selectMode').classList.remove('hidden');
        document.getElementById('customMode').classList.add('hidden');
        renderPlayerSelector();
    });

    // 渲染玩家选择器
    function renderPlayerSelector() {
        const playerSelector = document.getElementById('playerSelector');
        playerSelector.innerHTML = presetPlayers.map((player, index) => `
            <div class="player-option" data-index="${index}">
                ${player.name}
            </div>
        `).join('');

        // 添加点击事件
        playerSelector.querySelectorAll('.player-option').forEach(option => {
            option.addEventListener('click', () => {
                option.classList.toggle('selected');
            });
        });
    }

    // 全选玩家
    document.getElementById('selectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.player-option').forEach(option => {
            option.classList.add('selected');
        });
    });

    // 取消全选
    document.getElementById('deselectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.player-option').forEach(option => {
            option.classList.remove('selected');
        });
    });

    // 添加选中玩家
    document.getElementById('addSelectedBtn').addEventListener('click', () => {
        const selectedOptions = document.querySelectorAll('.player-option.selected');
        if (selectedOptions.length === 0) {
            alert('请先选择玩家！');
            return;
        }

        selectedOptions.forEach(option => {
            const index = parseInt(option.getAttribute('data-index'));
            const player = presetPlayers[index];

            // 检查是否已存在
            if (!allPlayers.some(p => p.name === player.name)) {
                allPlayers.push({...player, hero: ''});
            }
        });

        renderPlayerList();

        // 取消选择
        document.querySelectorAll('.player-option').forEach(option => {
            option.classList.remove('selected');
        });
    });

    // 清空玩家列表
    function clearPlayers() {
        if (allPlayers.length === 0) {
            alert('玩家列表已经是空的！');
            return;
        }

        if (confirm('确定要清空所有玩家吗？')) {
            allPlayers.length = 0;
            renderPlayerList();
        }
    }

    // 绑定清空按钮事件
    document.getElementById('clearPlayersBtn').addEventListener('click', clearPlayers);
    document.getElementById('clearPlayersBtn2').addEventListener('click', clearPlayers);

    // 添加玩家
    document.getElementById('addPlayerBtn').addEventListener('click', () => {
        const nameInput = document.getElementById('playerNameInput');
        const levelInput = document.getElementById('playerLevelInput');
        const name = nameInput.value.trim();
        const level = parseInt(levelInput.value) || 1;

        if (!name) {
            alert('请输入玩家名称！');
            return;
        }

        if (allPlayers.some(p => p.name === name)) {
            alert('该玩家已存在！');
            return;
        }

        allPlayers.push({name, level, hero: ''});
        renderPlayerList();

        // 清空输入
        nameInput.value = '';
        levelInput.value = '1';
    });

    // 渲染玩家列表
    function renderPlayerList() {
        const playerList = document.getElementById('playerList');
        playerList.innerHTML = allPlayers.map((player, index) => `
            <div class="player-item">
                <span class="name">${player.name}</span>
                <button class="remove-btn" onclick="removePlayer(${index})">×</button>
            </div>
        `).join('');
    }

    // 删除玩家
    function removePlayer(index) {
        allPlayers.splice(index, 1);
        renderPlayerList();
    }

    // 根据等级平衡分队
    function balanceTeamsByLevel() {
        // 清空队伍
        teamA.length = 0;
        teamB.length = 0;

        // 按等级分组
        const level3Players = allPlayers.filter(p => p.level === 3);
        const level2Players = allPlayers.filter(p => p.level === 2);
        const level1Players = allPlayers.filter(p => p.level === 1);

        // 随机打乱每个等级组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        shuffleArray(level3Players);
        shuffleArray(level2Players);
        shuffleArray(level1Players);

        // 分配等级3的玩家
        for (let i = 0; i < level3Players.length; i++) {
            if (i % 2 === 0) {
                teamA.push(level3Players[i]);
            } else {
                teamB.push(level3Players[i]);
            }
        }

        // 分配等级2的玩家
        for (let i = 0; i < level2Players.length; i++) {
            if (teamA.length <= teamB.length) {
                teamA.push(level2Players[i]);
            } else {
                teamB.push(level2Players[i]);
            }
        }

        // 分配等级1的玩家
        for (let i = 0; i < level1Players.length; i++) {
            if (teamA.length <= teamB.length) {
                teamA.push(level1Players[i]);
            } else {
                teamB.push(level1Players[i]);
            }
        }
    }

    // 随机整数生成
    function rndInt(max) {
        return Math.floor(Math.random() * max);
    }

    // 解析英雄
    function parseHero(heroStr) {
        const str = (heroStr || '').trim();
        if (!str) return null;

        const dashIndex = str.indexOf('-');
        if (dashIndex > 0) {
            const role = str.slice(0, dashIndex).trim().toUpperCase();
            const name = str.slice(dashIndex + 1).trim();
            if (['T', 'N', 'C'].includes(role)) {
                return {role, name, raw: str};
            }

            const firstChar = str[0].toUpperCase();
            if (['T', 'N', 'C'].includes(firstChar)) {
                return {role: firstChar, name: str.slice(1).trim() || str, raw: str};
            }

            return {role: 'C', name: str, raw: str};
        } else {
            const firstChar = str[0].toUpperCase();
            if (['T', 'N', 'C'].includes(firstChar) && str.length > 2 && str[1] === '-') {
                return {role: firstChar, name: str.slice(2).trim(), raw: str};
            }

            const firstChar2 = str[0].toUpperCase();
            if (['T', 'N', 'C'].includes(firstChar2)) {
                return {role: firstChar2, name: str.slice(1).trim() || str, raw: str};
            }

            return {role: 'C', name: str, raw: str};
        }
    }

    // 按角色分组英雄
    function groupHeroesByRole(heroes) {
        return {
            'T': heroes.filter(h => h.role === 'T'),
            'N': heroes.filter(h => h.role === 'N'),
            'C': heroes.filter(h => h.role === 'C'),
            'ALL': heroes.slice()
        };
    }

    // 为队伍分配英雄
    function assignTeamHeroes(team, heroGroups, teamSize, roleRequirements, usedHeroes = null) {
        const used = new Set();
        if (usedHeroes instanceof Set) {
            for (const hero of usedHeroes) used.add(hero);
        }

        const assignedHeroes = [];

        // 选择英雄的函数
        function pickHeroes(heroList, count) {
            const available = heroList.filter(h => !used.has(h.raw));
            if (available.length < count) return null;

            const picked = [];
            const tempList = available.slice();

            for (let i = 0; i < count; i++) {
                const index = rndInt(tempList.length);
                picked.push(tempList.splice(index, 1)[0]);
            }

            return picked;
        }

        // 分配坦克
        if (roleRequirements.needT > 0) {
            const tanks = pickHeroes(heroGroups.T, roleRequirements.needT);
            if (!tanks) return {ok: false, reason: `英雄池中 Tank(T) 可用数量不足（需要 ${roleRequirements.needT} 个）`};

            tanks.forEach(tank => {
                assignedHeroes.push(tank);
                used.add(tank.raw);
            });
        }

        // 分配支援
        if (roleRequirements.minN > 0) {
            const supports = pickHeroes(heroGroups.N, roleRequirements.minN);
            if (!supports) return {
                ok: false,
                reason: `英雄池中 Support(N) 可用数量不足（需要 ${roleRequirements.minN} 个）`
            };

            supports.forEach(support => {
                assignedHeroes.push(support);
                used.add(support.raw);
            });
        }

        // 分配剩余位置
        let remaining = teamSize - assignedHeroes.length;
        if (remaining > 0) {
            // 先尝试用输出英雄填充
            const dps = pickHeroes(heroGroups.C, Math.min(remaining, heroGroups.C.length));
            if (dps) {
                dps.forEach(d => {
                    assignedHeroes.push(d);
                    used.add(d.raw);
                });
                remaining = teamSize - assignedHeroes.length;
            }

            // 如果还有剩余位置，从所有英雄中随机选择
            if (remaining > 0) {
                const all = pickHeroes(heroGroups.ALL, remaining);
                if (!all) return {ok: false, reason: `英雄池总数不足以满足队伍人数（剩余需要 ${remaining} 位）`};

                all.forEach(hero => {
                    assignedHeroes.push(hero);
                    used.add(hero.raw);
                });
            }
        }

        // 随机打乱分配结果
        for (let i = assignedHeroes.length - 1; i > 0; i--) {
            const j = rndInt(i + 1);
            [assignedHeroes[i], assignedHeroes[j]] = [assignedHeroes[j], assignedHeroes[i]];
        }

        // 分配英雄给玩家
        for (let i = 0; i < teamSize; i++) {
            team[i].hero = assignedHeroes[i].raw;
        }

        // 更新已使用的英雄集合
        if (usedHeroes instanceof Set) {
            for (const hero of used) usedHeroes.add(hero);
        }

        return {ok: true};
    }

    // 开始抽取
    document.getElementById('startBtn').addEventListener('click', async () => {
        // 先平衡分队
        balanceTeamsByLevel();

        if (allPlayers.length === 0) return alert('请添加至少一名玩家！');

        const totalPlayers = teamA.length + teamB.length;
        if (totalPlayers !== 10 && totalPlayers !== 12) return alert('人数错误！5v5 需10人，6v6 需12人。');

        const allowRepeat = document.getElementById('allowRepeat').checked;
        const is5v5 = totalPlayers === 10;
        const teamSize = is5v5 ? 5 : 6;
        const roleRequirements = is5v5 ? {needT: 1, minN: 2} : {needT: 2, minN: 2};

        const allHeroes = heroPool.map(parseHero).filter(Boolean);
        const heroGroups = groupHeroesByRole(allHeroes);

        // 显示抽取动画
        modal.style.display = 'flex';
        finalResult.style.display = 'none';
        rollText.style.display = 'block';

        let rollInterval = setInterval(() => {
            const randomHero = allHeroes[rndInt(allHeroes.length)];
            rollText.textContent = randomHero ? randomHero.name : '抽取中...';
        }, 50);

        await new Promise(resolve => setTimeout(resolve, 1400));

        // 检查英雄池是否足够
        if (!allowRepeat) {
            const needT = roleRequirements.needT * 2;
            const needN = roleRequirements.minN * 2;

            if (heroGroups.T.length < needT) {
                clearInterval(rollInterval);
                modal.style.display = 'none';
                return alert(`英雄池中 Tank(T) 总数不足以同时满足两队（需要 ${needT} 位，总池 ${heroGroups.T.length}）`);
            }

            if (heroGroups.N.length < needN) {
                clearInterval(rollInterval);
                modal.style.display = 'none';
                return alert(`英雄池中 Support(N) 总数不足以同时满足两队（需要 ${needN} 位，总池 ${heroGroups.N.length}）`);
            }

            if (heroGroups.ALL.length < totalPlayers) {
                clearInterval(rollInterval);
                modal.style.display = 'none';
                return alert(`英雄池总数不足以同时满足两队（需要 ${totalPlayers} 位，总池 ${heroGroups.ALL.length}）`);
            }
        } else {
            if (heroGroups.T.length < roleRequirements.needT) {
                clearInterval(rollInterval);
                modal.style.display = 'none';
                return alert(`英雄池中 Tank(T) 可用数量不足，每队需 ${roleRequirements.needT} 个`);
            }

            if (heroGroups.N.length < roleRequirements.minN) {
                clearInterval(rollInterval);
                modal.style.display = 'none';
                return alert(`英雄池中 Support(N) 可用数量不足，每队需至少 ${roleRequirements.minN} 个`);
            }
        }

        // 分配英雄
        const usedHeroes = new Set();
        const teamAResult = assignTeamHeroes(teamA, heroGroups, teamA.length, roleRequirements, allowRepeat ? new Set() : usedHeroes);

        if (!teamAResult.ok) {
            clearInterval(rollInterval);
            modal.style.display = 'none';
            return alert(teamAResult.reason);
        }

        const teamBResult = assignTeamHeroes(teamB, heroGroups, teamB.length, roleRequirements, allowRepeat ? new Set() : usedHeroes);

        if (!teamBResult.ok) {
            clearInterval(rollInterval);
            modal.style.display = 'none';
            return alert(teamBResult.reason);
        }

        await new Promise(resolve => setTimeout(resolve, 600));
        clearInterval(rollInterval);

        // 显示最终结果
        rollText.style.display = 'none';
        finalResult.style.display = 'block';

        // 按角色排序显示
        const roleOrder = {'T': 1, 'C': 2, 'N': 3};

        const sortedTeamA = [...teamA].sort((a, b) => {
            const roleA = roleOrder[parseHero(a.hero)?.role] || 99;
            const roleB = roleOrder[parseHero(b.hero)?.role] || 99;
            return roleA - roleB;
        });

        const sortedTeamB = [...teamB].sort((a, b) => {
            const roleA = roleOrder[parseHero(a.hero)?.role] || 99;
            const roleB = roleOrder[parseHero(b.hero)?.role] || 99;
            return roleA - roleB;
        });

        finalResult.innerHTML = `
            <h3>抽取结果</h3>
            <table>
                <thead><tr><th>队伍</th><th>玩家</th><th>英雄</th><th>位置</th></tr></thead>
                <tbody>
                    ${sortedTeamA.map(player => {
            const heroInfo = parseHero(player.hero);
            return `
                            <tr class="teamA-row">
                                <td>A 队</td>
                                <td>${player.name}</td>
                                <td>${player.hero}</td>
                                <td>${heroInfo ? heroInfo.role : '-'}</td>
                            </tr>
                        `;
        }).join('')}
                    ${sortedTeamB.map(player => {
            const heroInfo = parseHero(player.hero);
            return `
                            <tr class="teamB-row">
                                <td>B 队</td>
                                <td>${player.name}</td>
                                <td>${player.hero}</td>
                                <td>${heroInfo ? heroInfo.role : '-'}</td>
                            </tr>
                        `;
        }).join('')}
                </tbody>
            </table>
            <div style="margin-top:12px;">
                <button id="closeModalBtn">关闭</button>
                <button id="reDrawBtn" style="margin-left:10px;">重新抽取</button>
            </div>
        `;

        document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
        document.getElementById('reDrawBtn').onclick = () => {
            // 清空英雄分配
            allPlayers.forEach(p => p.hero = '');

            // 禁用按钮防止重复点击
            document.getElementById('reDrawBtn').disabled = true;
            setTimeout(() => document.getElementById('reDrawBtn').disabled = false, 500);

            // 重新开始抽取
            modal.style.display = 'none';
            document.getElementById('startBtn').click();
        };
    });

    // 初始渲染
    renderHeroPool();
    renderPlayerList();
</script>
</body>
</html>
