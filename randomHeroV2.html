<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ow内战工具 - 全随机</title>
    <link rel="stylesheet" href="css/style.css?v=1.3">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>">
    <style>
        .backHome {
            position: fixed;
            top: 25px;
            left: 25px;
        }
    </style>
</head>
<body>
<!-- 新增：左上角返回首页按钮 -->
<button class="backHome" id="backHomeBtn" onclick="window.location.href='index.html'">
    返回首页
</button>

<h2>🎮 ow内战工具 - 全随机</h2>

<div class="feature-switches">
    <span style="cursor:pointer; margin-right: 20px;">
        <input type="checkbox" style="width: 20px" id="allowRepeat" checked>
        允许两队重复英雄
    </span>

    <span style="cursor:pointer; margin-right: 20px;">
        <input type="checkbox" style="width: 20px" id="randomHero" checked>
        自动分配英雄
    </span>
</div>

<div class="hero-pool-management">
    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
        <input id="heroInput" class="player-input" placeholder="添加英雄，如: T-莱因哈特">
        <button id="addHeroBtn" class="small-btn">添加英雄</button>
        <button id="resetHeroPoolBtn" class="small-btn">重置英雄池</button>
    </div>
    <div class="hero-pool-display" id="heroPoolDisplay">
        <!-- 英雄池 -->
    </div>
</div>

<div class="player-management">
    <div class="mode-selector">
        <div style="color: #ffcc00;font-weight: bold;text-shadow: 0 0 10px #ffaa00;">👥玩家列表</div>
    </div>

    <div id="customMode" class="player-mode">
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
            <input id="playerNameInput" class="player-input" placeholder="玩家名称">
            <select id="playerLevelInput">
                <option value="4">⭐⭐⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="2">⭐⭐</option>
                <option value="1">⭐</option>
            </select>
            <button id="addPlayerBtn" class="small-btn">添加玩家</button>
            <button id="addToPresetBtn" class="small-btn" style="background: #4CAF50;">保存为预设</button>
        </div>
    </div>

    <!-- 快速添加 -->
    <div style="display: flex;justify-content: space-around;gap: 10px">
        <div id="selectMode" class="player-mode" style="width: 400%">
            <div class="player-selector" id="playerSelector">
                <!-- 玩家选项 -->
            </div>
        </div>
        <div style="position: relative;background: #302f2f;width: 98%;margin:5px auto;padding:0 5px;border-radius: 10px;height: 345px">
            <div style="color: #ffcc00;font-weight: bold;text-shadow: 0 0 10px #ffaa00;position: sticky;top: 0;background: #302f2f;display: flex;align-items: center;justify-content: space-between;padding: 5px 0">
                <div style="flex: 1;text-align: center;">
                    👩‍🚀已选中玩家
                </div>
                <button id="clearPlayersBtn" class="small-btn" style="background: #e75757;margin: 0;">
                    清空
                </button>
            </div>
            <div class="player-list" id="playerList">
                <!-- 玩家列表 -->
            </div>
        </div>
    </div>
</div>
<div style="display: flex; justify-content: center; margin-top: 10px;">
    <button id="startBtn" style="margin-bottom: 20px">🎲 开始分配</button>
</div>

<!-- 内幕设置弹窗 -->
<div id="rivalModal" class="rival-modal">
    <div class="rival-modal-content">
        <h3 style="color: #ffcc00; margin-bottom: 20px;">😜 内幕彩蛋</h3>

        <!-- 宿敌设置 -->
        <div class="rival-section">
            <h4>敌对群友</h4>
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; align-items: center;">
                <select id="rivalPlayer1" style="flex: 1;">
                    <option value="">选择玩家1</option>
                </select>
                <span style="color: #ff3366; font-weight: bold;">VS</span>
                <select id="rivalPlayer2" style="flex: 1;">
                    <option value="">选择玩家2</option>
                </select>
                <button id="addRivalBtn" class="small-btn">确认</button>
            </div>
            <div id="rivalList" class="rival-list">
                <!-- 宿敌列表 -->
            </div>
        </div>

        <!-- 英雄绑定设置 -->
        <div class="rival-section">
            <h4>专属英雄</h4>
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; align-items: center;">
                <select id="bindPlayer" style="flex: 1;">
                    <option value="">选择玩家</option>
                </select>
                <select id="bindHero" style="flex: 1;">
                    <option value="">选择英雄</option>
                </select>
                <button id="addBindBtn" class="small-btn">确认</button>
            </div>
            <div id="bindList" class="bind-list">
                <!-- 绑定列表 -->
            </div>
        </div>

        <div class="rival-controls">
            <button id="closeRivalModal" class="small-btn">关闭</button>
            <button id="clearRivalsBtn" class="small-btn" style="background: #e75757">清空所有设置</button>
        </div>
    </div>
</div>

<!-- 结果弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div id="rollText" class="hero-roll">分配中...</div>
        <div id="finalResult" style="display:none;">
        </div>
        <div class="modal-footer">小分队出品🙂</div>
    </div>
</div>

<!-- 底部信息 -->
<div class="footer" id="footer">
    小分队出品🙂
</div>

<script src="js/config.js?v=1.0"></script>
<script>
    // 所有玩家
    const allPlayers = [];
    const teamA = [];
    const teamB = [];
    const modal = document.getElementById('modal');
    const rollText = document.getElementById('rollText');
    const finalResult = document.getElementById('finalResult');
    const rivalModal = document.getElementById('rivalModal');

    // 宿敌与绑定系统
    const rivals = []; // 宿敌对 [{player1, player2}]
    const heroBinds = []; // 英雄绑定 [{player, hero}]

    let heroPool = Array.isArray(window.DEFAULT_HERO_POOL) ? window.DEFAULT_HERO_POOL.slice() : [];

    const presetPlayers = Array.isArray(window.PRESET_PLAYERS) ? window.PRESET_PLAYERS : [];

    // 新增：玩家位置选择状态存储
    const playerRoleSelections = new Map(); // 存储玩家名称 -> 选择的角色数组

    // 获取可用的预设玩家（过滤掉已添加的玩家）
    function getAvailablePresetPlayers() {
        return presetPlayers.filter(presetPlayer =>
            !allPlayers.some(addedPlayer => addedPlayer.name === presetPlayer.name)
        );
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function () {
        renderHeroPool();
        renderPlayerList();
        renderPlayerSelector()
        setupEventListeners();
    });

    // 设置事件监听器
    function setupEventListeners() {
        // 英雄管理
        document.getElementById('addHeroBtn').addEventListener('click', addHero);
        document.getElementById('resetHeroPoolBtn').addEventListener('click', resetHeroPool);

        // 玩家管理
        document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
        document.getElementById('addToPresetBtn').addEventListener('click', addToPreset);
        document.getElementById('clearPlayersBtn').addEventListener('click', clearPlayers);

        // 宿敌与绑定事件
        document.getElementById('addRivalBtn').addEventListener('click', addRival);
        document.getElementById('addBindBtn').addEventListener('click', addHeroBind);
        document.getElementById('closeRivalModal').addEventListener('click', closeRivalModal);
        document.getElementById('clearRivalsBtn').addEventListener('click', clearRivals);

        // 开始抽取
        document.getElementById('startBtn').addEventListener('click', startDraw);

        // 双击底部显示宿敌设置
        document.getElementById('footer').addEventListener('dblclick', showRivalModal);

        // 点击弹窗外部关闭
        rivalModal.addEventListener('click', function (e) {
            if (e.target === rivalModal) {
                closeRivalModal();
            }
        });

        // 玩家名称输入框事件 - 添加过滤功能
        const playerNameInput = document.getElementById('playerNameInput');

        playerNameInput.addEventListener('input', function (e) {
            const query = e.target.value.trim().toLowerCase();
            filterPlayerOptions(query);
        });

        // 回车键添加玩家
        playerNameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });
    }

    // 添加玩家到预设列表 - 修复：避免重复保存
    function addToPreset() {
        const nameInput = document.getElementById('playerNameInput');
        const levelInput = document.getElementById('playerLevelInput');
        const name = nameInput.value.trim();
        const level = parseInt(levelInput.value) || 3;

        if (!name) {
            alert('请输入玩家名称！');
            return;
        }

        // 检查是否已存在预设中
        if (presetPlayers.some(p => p.name === name)) {
            alert('该玩家已在预设列表中！');
            return;
        }

        // 创建新的预设玩家（默认全选所有位置）
        const newPresetPlayer = {
            name: name,
            level: level,
            preferredRole: ['T', 'C', 'N'] // 默认全选
        };

        // 添加到window.PRESET_PLAYERS - 只添加一次
        if (!window.PRESET_PLAYERS) {
            window.PRESET_PLAYERS = [];
        }

        // 确保不会重复添加
        const alreadyExists = window.PRESET_PLAYERS.some(p => p.name === name);
        if (!alreadyExists) {
            // window.PRESET_PLAYERS.push(newPresetPlayer);
            presetPlayers.push(newPresetPlayer);

            // 重新渲染玩家选择器
            renderPlayerSelector();

            alert(`玩家 "${name}" 已保存到预设列表！`);
        } else {
            alert('该玩家已在预设列表中！');
        }
    }

    // 过滤玩家选项
    function filterPlayerOptions(query) {
        const playerSelector = document.getElementById('playerSelector');
        const playerOptions = playerSelector.querySelectorAll('.player-option');

        let hasVisibleOptions = false;

        playerOptions.forEach(option => {
            const playerNameElement = option.querySelector('div[onclick]');
            const playerName = playerNameElement.textContent.toLowerCase();

            // 检查是否匹配（包含匹配）
            if (!query || playerName.includes(query)) {
                option.style.display = 'block';
                hasVisibleOptions = true;
            } else {
                option.style.display = 'none';
            }
        });

        // 更新空状态显示
        const emptyState = playerSelector.querySelector('.empty-state');
        if (emptyState) {
            if (!hasVisibleOptions && query) {
                emptyState.textContent = '没有找到匹配的玩家';
                emptyState.style.display = 'block';
            } else if (!hasVisibleOptions && !query) {
                emptyState.textContent = '所有玩家都已添加';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }
    }

    // 显示宿敌设置弹窗
    function showRivalModal() {
        updateRivalSelectors();
        rivalModal.style.display = 'flex';
    }

    // 关闭宿敌设置弹窗
    function closeRivalModal() {
        rivalModal.style.display = 'none';
    }

    // 清空所有宿敌和绑定
    function clearRivals() {
        if (confirm('确定要清空所有敌对关系和英雄绑定吗？')) {
            rivals.length = 0;
            heroBinds.length = 0;
            renderRivalList();
            renderBindList();
        }
    }

    // 更新宿敌选择器
    function updateRivalSelectors() {
        const rivalSelect1 = document.getElementById('rivalPlayer1');
        const rivalSelect2 = document.getElementById('rivalPlayer2');
        const bindSelect = document.getElementById('bindPlayer');
        const bindHeroSelect = document.getElementById('bindHero');

        // 清空选项
        rivalSelect1.innerHTML = '<option value="">选择玩家1</option>';
        rivalSelect2.innerHTML = '<option value="">选择玩家2</option>';
        bindSelect.innerHTML = '<option value="">选择玩家</option>';
        // 添加玩家选项
        allPlayers.forEach(player => {
            const option = `<option value="${player.name}">${player.name}</option>`;
            rivalSelect1.innerHTML += option;
            rivalSelect2.innerHTML += option;
            bindSelect.innerHTML += option;
        });

        // 更新英雄选择器
        bindHeroSelect.innerHTML = '<option value="">选择英雄</option>';
        heroPool.forEach(hero => {
            bindHeroSelect.innerHTML += `<option value="${hero}">${hero}</option>`;
        });

    }

    // 添加宿敌
    function addRival() {
        const player1 = document.getElementById('rivalPlayer1').value;
        const player2 = document.getElementById('rivalPlayer2').value;

        if (!player1 || !player2) {
            alert('请选择两名玩家！');
            return;
        }

        if (player1 === player2) {
            alert('不能选择同一名玩家！');
            return;
        }

        // 检查是否已存在
        const exists = rivals.some(r =>
            (r.player1 === player1 && r.player2 === player2) ||
            (r.player1 === player2 && r.player2 === player1)
        );

        if (exists) {
            alert('这对sb已存在！');
            return;
        }

        rivals.push({player1, player2});
        renderRivalList();

        // 清空选择
        document.getElementById('rivalPlayer1').value = '';
        document.getElementById('rivalPlayer2').value = '';
    }

    // 渲染宿敌列表
    function renderRivalList() {
        const rivalList = document.getElementById('rivalList');
        if (rivals.length === 0) {
            rivalList.innerHTML = '<div style="color: #888; padding: 10px;">暂无敌对设置</div>';
            return;
        }
        rivalList.innerHTML = rivals.map((rival, index) => `
            <div class="rival-item">
                <span>${rival.player1} 🆚 ${rival.player2}</span>
                <button class="remove-rival-btn" onclick="removeRival(${index})">删除</button>
            </div>
        `).join('');
    }

    // 删除宿敌
    function removeRival(index) {
        rivals.splice(index, 1);
        renderRivalList();
    }

    // 添加英雄绑定
    function addHeroBind() {
        const player = document.getElementById('bindPlayer').value;
        const hero = document.getElementById('bindHero').value;
        if (!player || !hero) {
            alert('请选择玩家和英雄！');
            return;
        }

        // 检查是否已存在
        const exists = heroBinds.some(b => b.player === player);
        if (exists) {
            alert('该玩家已有英雄绑定！');
            return;
        }

        heroBinds.push({player, hero});
        renderBindList();

        // 清空选择
        document.getElementById('bindPlayer').value = '';
        document.getElementById('bindHero').value = '';
    }

    // 渲染绑定列表
    function renderBindList() {
        const bindList = document.getElementById('bindList');
        if (heroBinds.length === 0) {
            bindList.innerHTML = '<div style="color: #888; padding: 10px;">暂无英雄绑定</div>';
            return;
        }

        bindList.innerHTML = heroBinds.map((bind, index) => `
            <div class="bind-item">
                <span>${bind.player} → ${bind.hero}</span>
                <button class="remove-bind-btn" onclick="removeHeroBind(${index})">删除</button>
            </div>
        `).join('');
    }

    // 删除英雄绑定
    function removeHeroBind(index) {
        heroBinds.splice(index, 1);
        renderBindList();
    }

    // 渲染英雄池
    function renderHeroPool() {
        const heroPoolDisplay = document.getElementById('heroPoolDisplay');
        heroPoolDisplay.innerHTML = heroPool.map((hero, index) => {
            const heroInfo = parseHero(hero);
            let roleClass = '';
            if (heroInfo) {
                if (heroInfo.role === 'T') roleClass = 'tank';
                else if (heroInfo.role === 'N') roleClass = 'support';
                else if (heroInfo.role === 'C') roleClass = 'damage';
            }
            return `
                <div class="hero-item ${roleClass}">
                    ${hero}
                    <button class="hero-remove-btn" onclick="removeHero(${index})">×</button>
                </div>
            `;
        }).join('');
    }

    // 添加英雄
    function addHero() {
        const heroInput = document.getElementById('heroInput');
        const hero = heroInput.value.trim();

        if (!hero) {
            alert('请输入英雄名称！');
            return;
        }

        // 检查格式
        const heroInfo = parseHero(hero);
        if (!heroInfo) {
            alert('英雄格式不正确！请使用格式：T-坦克名, N-支援名, C-输出名');
            return;
        }

        // 检查是否已存在
        if (heroPool.includes(hero)) {
            alert('该英雄已存在！');
            return;
        }

        heroPool.push(hero);
        renderHeroPool();
        heroInput.value = '';
    }

    // 删除英雄
    function removeHero(index) {
        heroPool.splice(index, 1);
        renderHeroPool();
    }

    // 重置英雄池
    function resetHeroPool() {
        if (confirm('确定要重置英雄池吗？这将恢复默认英雄列表。')) {
            heroPool = Array.isArray(window.DEFAULT_HERO_POOL) ? window.DEFAULT_HERO_POOL.slice() : [];
            renderHeroPool();
        }
    }

    // 渲染玩家选择器
    function renderPlayerSelector() {
        const playerSelector = document.getElementById('playerSelector');
        const availablePlayers = getAvailablePresetPlayers();

        if (availablePlayers.length === 0) {
            playerSelector.innerHTML = '<div class="empty-state">所有玩家都已添加</div>';
            return;
        }

        playerSelector.innerHTML = availablePlayers.map((player, index) => {
            // 获取该玩家之前的选择状态，如果没有则使用默认（全选）
            const playerKey = player.name;
            const selectedRoles = playerRoleSelections.get(playerKey) || ['T', 'C', 'N'];

            return `
            <div class="player-option" data-player-index="${index}">
                <div onclick="addPlayerFromList('${player.name}', ${index})"
                     style="cursor: pointer; border-radius: 6px; font-size: 12px;background: #2a2a2a;">
                    ${player.name}
                </div>
                <div class="role-selector" id="roleSelector-${index}">
                    <div class="role-option-btn role-t ${selectedRoles.includes('T') ? 'selected' : ''}"
                         style="writing-mode: vertical-rl;padding-right:10px"
                         onclick="toggleRole('${player.name}', 'T', event)">🛡️坦克</div>
                    <div class="role-option-btn role-c ${selectedRoles.includes('C') ? 'selected' : ''}"
                         style="writing-mode: vertical-rl;padding-right:10px"
                         onclick="toggleRole('${player.name}', 'C', event)">⚔️输出</div>
                    <div class="role-option-btn role-n ${selectedRoles.includes('N') ? 'selected' : ''}"
                         style="writing-mode: vertical-rl;padding-right:10px"
                         onclick="toggleRole('${player.name}', 'N', event)">🩹治疗</div>
                </div>
            </div>
        `;
        }).join('');

        // 确保所有选项默认显示
        const playerOptions = playerSelector.querySelectorAll('.player-option');
        playerOptions.forEach(option => {
            option.style.display = 'block';
        });
    }

    // 切换角色选择（多选）
    function toggleRole(playerName, role, event) {
        if (event) {
            event.stopPropagation(); // 防止触发父元素的点击事件
        }

        // 获取当前选择状态
        const currentRoles = playerRoleSelections.get(playerName) || ['T', 'C', 'N'];

        // 切换选择状态
        if (currentRoles.includes(role)) {
            // 如果已经选中，移除
            const index = currentRoles.indexOf(role);
            currentRoles.splice(index, 1);
        } else {
            // 如果没有选中，添加
            currentRoles.push(role);
        }

        // 保存选择状态
        playerRoleSelections.set(playerName, currentRoles);

        // 更新UI
        const playerOption = document.querySelector(`.player-option div[onclick*="${playerName}"]`).parentElement;
        const roleBtn = playerOption.querySelector(`.role-${role.toLowerCase()}`);
        roleBtn.classList.toggle('selected');
    }

    // 从列表添加玩家
    function addPlayerFromList(playerName, index) {
        const player = presetPlayers.find(p => p.name === playerName);
        if (!player) return;

        // 检查是否已存在
        if (!allPlayers.some(p => p.name === player.name)) {
            // 获取该玩家选择的位置
            const selectedRoles = playerRoleSelections.get(playerName) || ['T', 'C', 'N'];

            allPlayers.push({
                ...player,
                hero: '',
                preferredRole: selectedRoles.length > 0 ? selectedRoles : ['T', 'C', 'N'] // 至少选一个
            });
            renderPlayerList();
            renderPlayerSelector(); // 重新渲染选择器，移除已添加的玩家

            // 清空输入框并重置过滤器
            document.getElementById('playerNameInput').value = '';
            filterPlayerOptions('');
        }
    }

    // 清空玩家列表
    function clearPlayers() {
        if (allPlayers.length === 0) {
            alert('玩家列表已经是空的！');
            return;
        }

        if (confirm('确定要清空所有玩家吗？')) {
            allPlayers.length = 0;
            renderPlayerList();
            renderPlayerSelector(); // 重新渲染选择器，恢复所有玩家

            // 同时清空宿敌和绑定
            rivals.length = 0;
            heroBinds.length = 0;
            renderRivalList();
            renderBindList();

            // 清空输入框并重置过滤器
            document.getElementById('playerNameInput').value = '';
            filterPlayerOptions('');
        }
    }

    // 添加玩家
    function addPlayer() {
        const nameInput = document.getElementById('playerNameInput');
        const levelInput = document.getElementById('playerLevelInput');
        const name = nameInput.value.trim();
        const level = parseInt(levelInput.value) || 1;

        if (!name) {
            alert('请输入玩家名称！');
            return;
        }

        if (allPlayers.some(p => p.name === name)) {
            alert('该玩家已存在！');
            return;
        }

        // 新玩家默认可以玩所有位置
        allPlayers.push({
            name,
            level,
            hero: '',
            preferredRole: ['T', 'C', 'N'] // 默认全选
        });
        renderPlayerList();

        // 清空输入
        nameInput.value = '';
        nameInput.focus();
        levelInput.value = '3';

        // 重新渲染选择器，恢复所有选项显示
        renderPlayerSelector();
    }

    // 渲染玩家列表
    function renderPlayerList() {
        const playerList = document.getElementById('playerList');
        playerList.innerHTML = allPlayers.map((player, index) => {
            // 处理偏好位置显示
            let roleDisplay = '';
            if (Array.isArray(player.preferredRole)) {
                const roles = player.preferredRole;
                const roleNames = [];
                if (roles.includes('T')) roleNames.push('🛡️');
                if (roles.includes('C')) roleNames.push('⚔️');
                if (roles.includes('N')) roleNames.push('🩹');
                roleDisplay = roleNames.join(' ');
                if (roleDisplay === '') roleDisplay = '无';
            } else {
                // 兼容旧数据
                roleDisplay = player.preferredRole === 'any' ? '🛡️⚔️🩹' :
                    player.preferredRole === 'T' ? '🛡️' :
                        player.preferredRole === 'C' ? '⚔️' : '🩹';
            }

            return `
                <div class="player-item">
                    <span class="name">${player.name}</span>
                    <span class="role-info">${roleDisplay}</span>
                    <button class="remove-btn" onclick="removePlayer(${index})">×</button>
                </div>
            `;
        }).join('');
    }

    // 删除玩家
    function removePlayer(index) {
        const playerName = allPlayers[index].name;
        allPlayers.splice(index, 1);
        renderPlayerList();
        renderPlayerSelector(); // 重新渲染选择器，恢复被删除的玩家

        // 同时移除相关的宿敌和绑定
        removePlayerFromRivalsAndBinds(playerName);
    }

    // 当玩家被删除时，清理相关的宿敌和绑定
    function removePlayerFromRivalsAndBinds(playerName) {
        // 移除宿敌
        for (let i = rivals.length - 1; i >= 0; i--) {
            if (rivals[i].player1 === playerName || rivals[i].player2 === playerName) {
                rivals.splice(i, 1);
            }
        }
        renderRivalList();

        // 移除绑定
        for (let i = heroBinds.length - 1; i >= 0; i--) {
            if (heroBinds[i].player === playerName) {
                heroBinds.splice(i, 1);
            }
        }
        renderBindList();
    }

    // 根据等级和位置偏好平衡分队（支持宿敌系统）
    function balanceTeamsByLevel() {
        teamA.length = 0;
        teamB.length = 0;

        // Step 1: 宿敌强制分开（优先级最高）
        const placed = new Set();
        const remaining = [...allPlayers];

        rivals.forEach(r => {
            const p1 = remaining.find(p => p.name === r.player1 && !placed.has(p.name));
            const p2 = remaining.find(p => p.name === r.player2 && !placed.has(p.name));
            if (p1 && p2) {
                if (Math.random() < 0.5) {
                    teamA.push(p1);
                    teamB.push(p2);
                } else {
                    teamA.push(p2);
                    teamB.push(p1);
                }
                placed.add(p1.name);
                placed.add(p2.name);
            }
        });

        // Step 2: 剩余玩家彻底随机打乱 + 按等级降序（只为实力均衡）
        let left = remaining.filter(p => !placed.has(p.name));
        left.sort(() => Math.random() - 0.5);           // 彻底打乱
        left.sort((a, b) => b.level - a.level);         // 再按等级排序，保证贪心均衡

        // Step 3: 贪心分配：永远给当前总等级更低的队
        left.forEach(player => {
            const sumA = teamA.reduce((s, p) => s + p.level, 0);
            const sumB = teamB.reduce((s, p) => s + p.level, 0);

            const rivalInA = hasRivalInTeam(player, teamA);
            const rivalInB = hasRivalInTeam(player, teamB);

            if (rivalInA && !rivalInB) {
                teamB.push(player);
            } else if (rivalInB && !rivalInA) {
                teamA.push(player);
            } else if (sumA <= sumB) {
                teamA.push(player);
            } else {
                teamB.push(player);
            }
        });

        // Step 4: 人数不均时强制平衡（极少发生）
        while (teamA.length !== teamB.length) {
            if (teamA.length > teamB.length) {
                const p = teamA.pop();
                if (!hasRivalInTeam(p, teamB)) teamB.push(p);
                else teamA.push(p);
            } else {
                const p = teamB.pop();
                if (!hasRivalInTeam(p, teamA)) teamA.push(p);
                else teamB.push(p);
            }
        }

        console.log("分队完成：总等级差 ≤1，宿敌已分离，位置完全随机分配");
    }

    // 检查玩家在某个队伍中是否有宿敌
    function hasRivalInTeam(player, team) {
        return rivals.some(rival => {
            if (rival.player1 === player.name) {
                return team.some(p => p.name === rival.player2);
            }
            if (rival.player2 === player.name) {
                return team.some(p => p.name === rival.player1);
            }
            return false;
        });
    }

    // 随机整数生成
    function rndInt(max) {
        return Math.floor(Math.random() * max);
    }

    // 解析英雄
    function parseHero(heroStr) {
        const str = (heroStr || '').trim();
        if (!str) return null;

        const dashIndex = str.indexOf('-');
        if (dashIndex > 0) {
            const role = str.slice(0, dashIndex).trim().toUpperCase();
            const name = str.slice(dashIndex + 1).trim();
            if (['T', 'N', 'C'].includes(role)) {
                return {role, name, raw: str};
            }

            const firstChar = str[0].toUpperCase();
            if (['T', 'N', 'C'].includes(firstChar)) {
                return {role: firstChar, name: str.slice(1).trim() || str, raw: str};
            }

            return {role: 'C', name: str, raw: str};
        } else {
            const firstChar = str[0].toUpperCase();
            if (['T', 'N', 'C'].includes(firstChar) && str.length > 2 && str[1] === '-') {
                return {role: firstChar, name: str.slice(2).trim(), raw: str};
            }

            const firstChar2 = str[0].toUpperCase();
            if (['T', 'N', 'C'].includes(firstChar2)) {
                return {role: firstChar2, name: str.slice(1).trim() || str, raw: str};
            }

            return {role: 'C', name: str, raw: str};
        }
    }

    // 按角色分组英雄
    function groupHeroesByRole(heroes) {
        return {
            'T': heroes.filter(h => h.role === 'T'),
            'N': heroes.filter(h => h.role === 'N'),
            'C': heroes.filter(h => h.role === 'C'),
            'ALL': heroes.slice()
        };
    }

    // 获取队伍位置需求 - 修复：正确的5v5和6v6位置需求
    function getTeamRoleRequirements(teamSize) {
        if (teamSize === 5) {
            // 5v5: 1T, 2C, 2N
            return {T: 1, C: 2, N: 2};
        } else if (teamSize === 6) {
            // 6v6: 2T, 2C, 2N
            return {T: 2, C: 2, N: 2};
        } else {
            // 默认返回5v5配置
            return {T: 1, C: 2, N: 2};
        }
    }

    // 分配英雄函数 - 加强版 + 严格限制数量
    function assignTeamHeroes(team, heroGroups, teamSize, usedHeroes = null) {
        const used = usedHeroes || new Set();

        // 清空非绑定英雄
        team.forEach(p => {
            if (!heroBinds.some(b => b.player === p.name)) p.hero = '';
        });

        const needs = getTeamRoleRequirements(teamSize);
        console.log(`本队需求：T=${needs.T} C=${needs.C} N=${needs.N}`);

        // 处理绑定英雄
        team.forEach(player => {
            const bind = heroBinds.find(b => b.player === player.name);
            if (bind && !used.has(bind.hero)) {
                const hi = parseHero(bind.hero);
                if (hi) {
                    player.hero = bind.hero;
                    used.add(bind.hero);
                    console.log(`绑定 → ${player.name} : ${bind.hero} (${hi.role})`);
                }
            }
        });

        let current = {T: 0, C: 0, N: 0};
        team.forEach(p => {
            const r = parseHero(p.hero)?.role;
            if (r && current[r] !== undefined) current[r]++;
        });

        const unassigned = team.filter(p => !p.hero);

        // 统计全局必须单一位置玩家数量（全队10人或12人）
        const totalMustT = unassigned.filter(p => p.preferredRole?.join(',') === 'T').length;
        const totalMustN = unassigned.filter(p => p.preferredRole?.join(',') === 'N').length;
        const totalMustC = unassigned.filter(p => p.preferredRole?.join(',') === 'C').length;

        // 全局最大允许数量（两队总和）
        const maxT = needs.T * 2;   // 5v5: 2, 6v6: 4
        const maxN = needs.N * 2;   // 4
        const maxC = needs.C * 2;   // 4

        // 如果必须单一位置超过全局最大允许 → 移除所有非必须玩家的该位置偏好
        if (totalMustT > maxT) {
            console.log(`全局必须T(${totalMustT}) > 最大允许(${maxT})，移除所有非必须T玩家的T偏好`);
            team.forEach(p => {
                if (p.preferredRole?.join(',') !== 'T') {
                    p.preferredRole = p.preferredRole?.filter(r => r !== 'T') || [];
                }
            });
        }

        if (totalMustN > maxN) {
            console.log(`全局必须N(${totalMustN}) > 最大允许(${maxN})，移除所有非必须N玩家的N偏好`);
            team.forEach(p => {
                if (p.preferredRole?.join(',') !== 'N') {
                    p.preferredRole = p.preferredRole?.filter(r => r !== 'N') || [];
                }
            });
        }

        if (totalMustC > maxC) {
            console.log(`全局必须C(${totalMustC}) > 最大允许(${maxC})，移除所有非必须C玩家的C偏好`);
            team.forEach(p => {
                if (p.preferredRole?.join(',') !== 'C') {
                    p.preferredRole = p.preferredRole?.filter(r => r !== 'C') || [];
                }
            });
        }

        // 重新分类（偏好已修正）
        const finalMustT = unassigned.filter(p => p.preferredRole?.join(',') === 'T');
        const finalMustN = unassigned.filter(p => p.preferredRole?.join(',') === 'N');
        const finalMustC = unassigned.filter(p => p.preferredRole?.join(',') === 'C');

        const canT = unassigned.filter(p => p.preferredRole?.includes('T') && !finalMustT.some(m => m.name === p.name));
        const canN = unassigned.filter(p => p.preferredRole?.includes('N') && !finalMustN.some(m => m.name === p.name));
        const canC = unassigned.filter(p => p.preferredRole?.includes('C') && !finalMustC.some(m => m.name === p.name));

        const flexible = unassigned.filter(p =>
            !p.preferredRole?.length || p.preferredRole.length > 1
        );

        console.log("修正后必须T:", finalMustT.map(p => p.name));
        console.log("修正后必须N:", finalMustN.map(p => p.name));
        console.log("修正后必须C:", finalMustC.map(p => p.name));

        // === 分配函数 ===
        function tryAssign(player, role) {
            if (current[role] >= needs[role]) return false;
            const avail = heroGroups[role].filter(h => !used.has(h.raw));
            if (avail.length === 0) return false;
            const hero = avail[Math.floor(Math.random() * avail.length)];
            player.hero = hero.raw;
            used.add(hero.raw);
            current[role]++;
            console.log(`分配成功 ${player.name} → ${role} (${hero.raw})`);
            return true;
        }

        let allocationSuccess = true;

        // 1. 分配必须玩家（优先级最高）
        [{role: 'T', list: finalMustT}, {role: 'N', list: finalMustN}, {role: 'C', list: finalMustC}].forEach(g => {
            g.list.forEach(p => {
                if (!p.hero) {
                    if (!tryAssign(p, g.role)) {
                        console.warn(`必须${g.role}玩家 ${p.name} 分配失败（英雄或位置已满）`);
                        allocationSuccess = false;
                    }
                }
            });
        });

        // 如果必须玩家分配不成功，直接返回失败（后续触发重抽）
        if (!allocationSuccess) {
            return {ok: false, reason: '必须单一位置玩家未全部获得对应位置'};
        }

        // 2. 分配偏好玩家（多选偏好也随机抽取）
        const preferPlayers = [...canT, ...canN, ...canC];
        preferPlayers.sort(() => Math.random() - 0.5); // 偏好玩家顺序随机

        preferPlayers.forEach(p => {
            if (p.hero) return;
            const roles = p.preferredRole || [];
            if (roles.length === 0) return;

            // 从他的偏好里随机选一个缺位
            const avail = roles.filter(r => current[r] < needs[r]);
            if (avail.length > 0) {
                const randomRole = avail[Math.floor(Math.random() * avail.length)];
                tryAssign(p, randomRole);
            }
        });

        // 3. 剩余填补（真正随机抽取位置）
        let remaining = team.filter(p => !p.hero);
        remaining.sort(() => Math.random() - 0.5); // 玩家顺序随机

        for (const player of remaining) {
            if (player.hero) continue;

            // 获取当前所有缺位
            const availRoles = ['T', 'N', 'C'].filter(r => current[r] < needs[r]);

            if (availRoles.length === 0) {
                const allAvail = heroGroups.ALL.filter(h => !used.has(h.raw));
                if (allAvail.length > 0) {
                    const h = allAvail[Math.floor(Math.random() * allAvail.length)];
                    player.hero = h.raw;
                    used.add(h.raw);
                    console.log(`位置已满，随机英雄 → ${player.name} → ${h.raw}`);
                }
                continue;
            }

            // 从缺位中随机选一个位置（不再按 T→N→C 顺序）
            const randomRole = availRoles[Math.floor(Math.random() * availRoles.length)];

            // 尝试分配
            if (!tryAssign(player, randomRole)) {
                // 如果这个位置英雄用完了，再随机试其他缺位
                for (const r of availRoles) {
                    if (r !== randomRole && tryAssign(player, r)) break;
                }
            }
        }

        const final = {T: current.T, C: current.C, N: current.N};
        console.log("最终分配结果:", final);

        return {ok: true};
    }

    // 检查分配是否符合要求
    function isValidAllocation(teamA, teamB, teamSize) {
        const reqT = teamSize === 5 ? 1 : 2;
        const reqC = 2;
        const reqN = 2;

        const countA = {
            T: teamA.filter(p => parseHero(p.hero)?.role === 'T').length,
            C: teamA.filter(p => parseHero(p.hero)?.role === 'C').length,
            N: teamA.filter(p => parseHero(p.hero)?.role === 'N').length
        };

        const countB = {
            T: teamB.filter(p => parseHero(p.hero)?.role === 'T').length,
            C: teamB.filter(p => parseHero(p.hero)?.role === 'C').length,
            N: teamB.filter(p => parseHero(p.hero)?.role === 'N').length
        };

        const validA = countA.T === reqT && countA.C === reqC && countA.N === reqN;
        const validB = countB.T === reqT && countB.C === reqC && countB.N === reqN;

        const noEmpty = teamA.every(p => p.hero) && teamB.every(p => p.hero);

        return validA && validB && noEmpty;
    }

                    if (roles.includes('C')) roleNames.push('⚔️');
                    if (roles.includes('N')) roleNames.push('🩹');
                    preferredRoleDisplay = roleNames.join(' ');
                    if (preferredRoleDisplay === '') preferredRoleDisplay = '无';
                } else {
                    preferredRoleDisplay = player.preferredRole === 'any' ? '任意' :
                        player.preferredRole === 'T' ? '🛡️' :
                            player.preferredRole === 'C' ? '⚔️' : '🩹';
                }
                return `
                                <tr class="teamA-row">
                                    <td>A 队</td>
                                    <td>${player.name}</td>
                                    <td>${player.hero || '-'}</td>
                                    <td>${heroInfo ? heroInfo.role : '-'}</td>
                                    <td>${preferredRoleDisplay}</td>
                                </tr>
                            `;
            }).join('')}
                        ${sortedTeamB.map(player => {
                const heroInfo = parseHero(player.hero);
                let preferredRoleDisplay = '';
                if (Array.isArray(player.preferredRole)) {
                    const roles = player.preferredRole;
                    const roleNames = [];
                    if (roles.includes('T')) roleNames.push('🛡️');
                    if (roles.includes('C')) roleNames.push('⚔️');
                    if (roles.includes('N')) roleNames.push('🩹');
                    preferredRoleDisplay = roleNames.join(' ');
                    if (preferredRoleDisplay === '') preferredRoleDisplay = '无';
                } else {
                    preferredRoleDisplay = player.preferredRole === 'any' ? '任意' :
                        player.preferredRole === 'T' ? '🛡️' :
                            player.preferredRole === 'C' ? '⚔️' : '🩹';
                }
                return `
                                <tr class="teamB-row">
                                    <td>B 队</td>
                                    <td>${player.name}</td>
                                    <td>${player.hero || '-'}</td>
                                    <td>${heroInfo ? heroInfo.role : '-'}</td>
                                    <td>${preferredRoleDisplay}</td>
                                </tr>
                            `;
            }).join('')}
                    </tbody>
                </table>
                <div style="margin-top:12px;">
                    <button id="closeModalBtn" class="small-btn">关闭</button>
                    <button id="reDrawBtn" class="small-btn" style="margin-left:10px;">重新抽取</button>
                </div>
            `;

            document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';
            document.getElementById('reDrawBtn').onclick = () => {
                allPlayers.forEach(p => p.hero = '');
                document.getElementById('reDrawBtn').disabled = true;
                setTimeout(() => document.getElementById('reDrawBtn').disabled = false, 500);
                modal.style.display = 'none';
                startDraw();
            };

            if (!isValid) {
                alert(`分配异常（位置分布不符），已自动重试 ${retryCount} 次，请检查英雄池或手动重新抽取`);
            }
        } else {
            retryCount++;
            console.log(`位置分布不符，正在第 ${retryCount} 次重试...`);
            teamA.forEach(p => p.hero = '');
            teamB.forEach(p => p.hero = '');
            await new Promise(r => setTimeout(r, 400));
            await tryDrawWithRetry();
        }
    }

    function isValidAllocation(teamA, teamB, teamSize) {
        const reqT = teamSize === 5 ? 1 : 2;
        const reqC = 2;
        const reqN = 2;

        const countA = {
            T: teamA.filter(p => parseHero(p.hero)?.role === 'T').length,
            C: teamA.filter(p => parseHero(p.hero)?.role === 'C').length,
            N: teamA.filter(p => parseHero(p.hero)?.role === 'N').length
        };

        const countB = {
            T: teamB.filter(p => parseHero(p.hero)?.role === 'T').length,
            C: teamB.filter(p => parseHero(p.hero)?.role === 'C').length,
            N: teamB.filter(p => parseHero(p.hero)?.role === 'N').length
        };

        const validA = countA.T === reqT && countA.C === reqC && countA.N === reqN;
        const validB = countB.T === reqT && countB.C === reqC && countB.N === reqN;

        const noEmpty = teamA.every(p => p.hero) && teamB.every(p => p.hero);

        return validA && validB && noEmpty;
    }
</script>
